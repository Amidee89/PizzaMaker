<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PizzaMaker 3D - Artisanal 3D Pizza Synthesizer & Customizer</title>
  <meta name="description" content="Design your dream pizza in real-time 3D with procedural dough, wood-fired charring, parametric slicing, and rich topping scattering.">

  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="index.css">

  <!-- Three.js ES Modules Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Loading Splash Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loader-content">
      <div class="pizza-spinner">🍕</div>
      <h2 class="loader-title">PIZZAMAKER 3D</h2>
      <p class="loader-sub">Heating the woodfired stone oven & preparing dough...</p>
    </div>
  </div>

  <!-- Top App Navigation & Presets Bar -->
  <header class="app-header">
    <div class="header-brand">
      <span class="brand-logo">🍕</span>
      <div class="brand-text">
        <h1 class="brand-title">PIZZAMAKER <span>3D</span></h1>
        <span class="brand-badge">PRO PROCEDURAL ENGINE</span>
      </div>
    </div>

    <!-- Presets Quick Bar -->
    <div class="preset-scroll-container">
      <div id="presetBar" class="preset-bar">
        <!-- Injected via JavaScript -->
      </div>
    </div>

    <!-- Header Action Buttons -->
    <div class="header-actions">
      <button id="btnRandomize" class="action-btn btn-random" title="Randomize Pizza">
        <span>🎲</span> Randomize
      </button>
      <button id="btnSnapshot" class="action-btn btn-snapshot" title="Take HD Screenshot">
        <span>📸</span> Snapshot
      </button>
      <button id="btnExport3D" class="action-btn btn-export" title="Export 3D Model (GLTF)">
        <span>💾</span> Export 3D
      </button>
      <button id="btnCopyRecipe" class="action-btn btn-recipe" title="Copy Pizza Recipe JSON">
        <span>📋</span> Recipe
      </button>
    </div>
  </header>

  <!-- Main Viewport Workspace -->
  <main class="app-main">
    <!-- 3D WebGL Canvas Container -->
    <div class="viewport-container">
      <canvas id="webglCanvas"></canvas>

      <!-- Viewport Floating HUD: Camera Quick Tools -->
      <div class="viewport-hud-top">
        <div class="camera-toolbar">
          <button id="camHero" class="hud-btn active" title="Hero 45° Angle">🎬 Hero 45°</button>
          <button id="camTop" class="hud-btn" title="Top-Down Flat Lay">📐 Top Down</button>
          <button id="camClose" class="hud-btn" title="Cross-Section Macro Close-Up">🔍 Macro Crumb</button>
          <button id="camAutoRotate" class="hud-btn" title="Toggle Auto-Rotation">🔄 Rotate</button>
        </div>
      </div>

      <!-- Viewport Floating HUD: Slicing Quick Bar -->
      <div class="viewport-hud-bottom">
        <div id="sliceQuickToolbar" class="slice-quick-toolbar">
          <!-- Injected via JavaScript -->
        </div>
      </div>

      <div class="viewport-hint">
        💡 <span>Click any pizza slice to pull it out & inspect the internal crumb! Drag to rotate, scroll to zoom.</span>
      </div>
    </div>

    <!-- Right-hand Floating Glassmorphic Inspector Sidebar -->
    <aside class="controls-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-group">
          <h2 class="sidebar-title">PIZZA STUDIO INSPECTOR</h2>
          <span class="sidebar-subtitle">Live Parametric Synthesis</span>
        </div>
        <button id="btnToggleAllSections" class="btn-toggle-sections" title="Expand / Collapse all categories">⊟ Collapse All</button>
      </div>

      <div id="controlsSidebar" class="sidebar-content">
        <!-- Accordion Cards dynamically generated by UIManager -->
      </div>
    </aside>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastNotification" class="toast-popup"></div>

  <!-- Main Application Script -->
  <script type="module" src="src/main.js?v=3.2"></script>
</body>
</html>
