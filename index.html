<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Maker 3D</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍕 Pizza Maker 3D</h1>
            <p>Customize your perfect pizza shape!</p>
        </header>
        <main>
            <aside class="controls-panel">
                <!-- Ported controls -->
                <div class="control-group">
                    <label>Number of Sides:</label>
                    <div class="slider-container">
                        <input type="range" id="sides-slider" min="3" max="50" value="8" class="slider">
                        <span id="sides-value" class="slider-value">8</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Stellation:</label>
                    <div class="slider-container">
                        <input type="range" id="stellation-slider" min="0" max="1" step="0.01" value="0" class="slider">
                        <span id="stellation-value" class="slider-value">0.0</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Pizza Height:</label>
                    <div class="slider-container">
                        <input type="range" id="pizza-height-slider" min="0.1" max="2" step="0.1" value="0.5" class="slider">
                        <span id="pizza-height-value" class="slider-value">0.5</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Crust Thickness:</label>
                    <div class="slider-container">
                        <input type="range" id="crust-thickness-slider" min="0" max="1" step="0.1" value="0.3" class="slider">
                        <span id="crust-thickness-value" class="slider-value">0.3</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Crust Proportion:</label>
                    <div class="slider-container">
                        <input type="range" id="crust-proportion-slider" min="0" max="0.99" step="0.01" value="0.2" class="slider">
                        <span id="crust-proportion-value" class="slider-value">0.2</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Ovalness:</label>
                    <div class="slider-container">
                        <input type="range" id="ovalness-slider" min="0" max="3" step="0.01" value="0" class="slider">
                        <span id="ovalness-value" class="slider-value">0.00</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Ovalness Direction:</label>
                    <div class="slider-container">
                        <input type="range" id="ovalness-direction-slider" min="0" max="360" value="0" class="slider">
                        <span id="ovalness-direction-value" class="slider-value">0°</span>
                    </div>
                </div>
                <!-- Skeleton for new controls (examples) -->
                <div class="control-group">
                    <label>Bowl/Dome:</label>
                    <div class="slider-container">
                        <input type="range" id="bowl-dome-slider" min="-1" max="1" step="0.1" value="0" class="slider">
                        <span id="bowl-dome-value" class="slider-value">0</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Thickness Variance Density:</label>
                    <div class="slider-container">
                        <input type="range" id="thickness-variance-density-slider" min="0" max="1" step="0.1" value="0.5" class="slider">
                        <span id="thickness-variance-density-value" class="slider-value">0.5</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Thickness Variance Intensity:</label>
                    <div class="slider-container">
                        <input type="range" id="thickness-variance-slider" min="0" max="1" step="0.1" value="0" class="slider">
                        <span id="thickness-variance-value" class="slider-value">0</span>
                    </div>
                </div>
                <!-- TODO: Add more sliders/groups for crust, sauce, toppings, etc. -->
                <!-- e.g., Buttons for add topping/seasoning -->
            </aside>
            <section class="viewer-container">
                <div id="pizza-viewer"></div>
                <div class="instructions">
                    <p>🖱️ Drag to rotate • 🔍 Scroll to zoom</p>
                </div>
                <div class="slice-controls">
                    <div class="control-group">
                        <label>Number of Slices:</label>
                        <div class="slider-container">
                            <input type="range" id="slices-slider" min="1" max="8" value="8" class="slider">
                            <span id="slices-value" class="slider-value">8</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
